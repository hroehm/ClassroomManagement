<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Maker - Classroom Command Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition border border-slate-700">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-users-rectangle text-purple-400"></i> Group Maker
                </h1>
                <p class="text-xs text-slate-400">Collaborative Cohorts & Role Assignment</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        <div class="glass-card rounded-2xl p-6 border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Number of Groups</label>
                    <select id="numGroups" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white">
                        <option value="2">2 Groups</option>
                        <option value="3">3 Groups</option>
                        <option value="4" selected>4 Groups</option>
                        <option value="5">5 Groups</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 pt-5">
                    <input type="checkbox" id="enableRoles" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-purple-600 focus:ring-0">
                    <label for="enableRoles" class="text-xs font-semibold text-slate-300">Assign Job Roles</label>
                </div>
            </div>
            <button onclick="generateGroups()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl shadow-md flex items-center gap-2">
                <i class="fa-solid fa-shuffle"></i> Generate Groups
            </button>
        </div>

        <div id="groupsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamic Groups -->
        </div>
    </main>

    <script>
        const ROSTER = [
            "Alexander, Marcus", "Bennett, Chloe", "Carter, Ethan", "Davis, Sophia",
            "Edwards, Liam", "Foster, Ava", "Garcia, Noah", "Harris, Isabella",
            "Jackson, Lucas", "King, Mia", "Lee, Oliver", "Martinez, Charlotte",
            "Nelson, Elijah", "Owens, Amelia", "Patterson, James", "Quinn, Harper"
        ];
        const ROLES = ["Lead Facilitator", "Lead Researcher", "Recorder / Reporter", "Materials Manager"];
        const COLORS = ["bg-indigo-600", "bg-purple-600", "bg-emerald-600", "bg-amber-600", "bg-rose-600"];

        function generateGroups() {
            const count = parseInt(document.getElementById('numGroups').value);
            const assignRoles = document.getElementById('enableRoles').checked;
            const shuffled = [...ROSTER].sort(() => 0.5 - Math.random());
            const groups = Array.from({ length: count }, () => []);

            shuffled.forEach((student, idx) => {
                groups[idx % count].push(student);
            });

            const container = document.getElementById('groupsContainer');
            container.innerHTML = groups.map((g, idx) => `
                <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
                    <div class="${COLORS[idx % COLORS.length]} p-4 font-bold text-white text-sm flex items-center justify-between">
                        <span>Group ${idx + 1}</span>
                        <span class="text-xs opacity-80">${g.length} Students</span>
                    </div>
                    <div class="p-4 space-y-3">
                        ${g.map((student, sIdx) => `
                            <div class="p-3 bg-slate-900/60 border border-slate-800 rounded-xl flex items-center justify-between">
                                <span class="text-xs font-semibold text-slate-200">${student}</span>
                                ${assignRoles ? `<span class="text-[10px] font-bold text-purple-400 bg-purple-500/10 border border-purple-500/20 px-2 py-0.5 rounded">${ROLES[sIdx % ROLES.length]}</span>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        window.onload = generateGroups;
    </script>
</body>
</html>
