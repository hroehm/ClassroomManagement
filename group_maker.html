<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Group Maker - Collierville High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://chnis.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-slate-100 font-sans antialiased pb-12">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="bg-purple-600 p-2.5 rounded-xl shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-users-gear text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">Classroom Group Maker</h1>
                    <p class="text-xs text-purple-400 font-medium">Auto-Grouping, Job Roles & Separation Rules</p>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-200" id="userDisplayChip">
                Teacher 1 (Room 101)
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

        <div class="glass-card rounded-2xl p-6 shadow-xl space-y-5">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div class="flex items-center space-x-4">
                    <div>
                        <label class="block text-[10px] font-bold text-purple-400 uppercase tracking-wider mb-1">Target Class Block:</label>
                        <select id="blockSelect" onchange="loadBlockRoster()" class="bg-slate-900 border border-slate-700 text-white text-sm font-semibold rounded-xl px-3 py-2 outline-none">
                            <option value="Block 1">Block 1 (Algebra I)</option>
                            <option value="Block 2">Block 2 (Geometry)</option>
                            <option value="Block 3">Block 3 (Advisory)</option>
                            <option value="Block 4">Block 4 (Honors Math)</option>
                            <option value="Block 5">Block 5 (Algebra II)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-purple-400 uppercase tracking-wider mb-1">Grouping Mode:</label>
                        <select id="groupSizeSelect" class="bg-slate-900 border border-slate-700 text-white text-sm font-semibold rounded-xl px-3 py-2 outline-none">
                            <option value="2">Pairs (2 per group)</option>
                            <option value="3" selected>Trios (3 per group)</option>
                            <option value="4">Quad Squads (4 per group)</option>
                            <option value="5">Teams of 5</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <label class="flex items-center space-x-2 text-xs font-semibold text-slate-300 cursor-pointer bg-slate-900/80 border border-slate-700 px-3 py-2 rounded-xl">
                        <input type="checkbox" id="enableJobsToggle" checked class="rounded border-slate-700 text-purple-600 focus:ring-purple-500">
                        <span>Assign Group Job Roles</span>
                    </label>

                    <button onclick="generateGroups()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-purple-600/30 flex items-center space-x-2">
                        <i class="fa-solid fa-dice"></i>
                        <span>Auto-Form Groups</span>
                    </button>
                </div>
            </div>

            <!-- Do Not Pair Rule Config -->
            <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl space-y-3">
                <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center justify-between">
                    <span><i class="fa-solid fa-ban text-rose-400 mr-1.5"></i> "Do Not Pair" Separation Rules</span>
                    <span class="text-[10px] text-slate-400">Selected students will never be placed in the same group</span>
                </div>

                <div class="flex flex-wrap items-center gap-3 text-xs">
                    <span class="text-slate-300">Keep</span>
                    <select id="pairStudentA" class="bg-slate-900 border border-slate-700 text-white p-2 rounded-lg"></select>
                    <span class="text-rose-400 font-bold">&ne; Separated From</span>
                    <select id="pairStudentB" class="bg-slate-900 border border-slate-700 text-white p-2 rounded-lg"></select>
                    <button onclick="addDoNotPairRule()" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-3 py-1.5 rounded-lg">Add Rule</button>
                </div>

                <div id="rulesList" class="flex flex-wrap gap-2 pt-1 text-xs"></div>
            </div>
        </div>

        <!-- Generated Groups Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="groupsGrid"></div>
    </main>

    <script>
        const DEFAULT_ROSTER = [
            "Alex Miller", "Jordan Smith", "Taylor Johnson", "Morgan Davis", 
            "Casey Brown", "Riley Wilson", "Avery Garcia", "Sam Martinez",
            "Dakota Lee", "Peyton Clark", "Quinn Lewis", "Reese Walker"
        ];

        const JOB_ROLES = ["Lead Facilitator", "Lead Researcher", "Recorder / Reporter", "Materials Manager"];
        let doNotPairRules = [];

        function initGroupMaker() {
            const saved = sessionStorage.getItem("cms_active_user");
            if (saved) {
                const user = JSON.parse(saved);
                document.getElementById("userDisplayChip").textContent = `${user.name} (${user.room})`;
            }
            loadBlockRoster();
        }

        function loadBlockRoster() {
            const selA = document.getElementById("pairStudentA");
            const selB = document.getElementById("pairStudentB");
            selA.innerHTML = "";
            selB.innerHTML = "";

            DEFAULT_ROSTER.forEach(s => {
                selA.innerHTML += `<option value="${s}">${s}</option>`;
                selB.innerHTML += `<option value="${s}">${s}</option>`;
            });

            generateGroups();
        }

        function addDoNotPairRule() {
            const a = document.getElementById("pairStudentA").value;
            const b = document.getElementById("pairStudentB").value;
            if (a === b) {
                alert("Please select two different students.");
                return;
            }

            doNotPairRules.push({ a, b });
            renderRules();
            generateGroups();
        }

        function removeRule(index) {
            doNotPairRules.splice(index, 1);
            renderRules();
            generateGroups();
        }

        function renderRules() {
            const box = document.getElementById("rulesList");
            box.innerHTML = "";
            doNotPairRules.forEach((r, idx) => {
                box.innerHTML += `
                    <span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-1 rounded-lg flex items-center space-x-1.5">
                        <span>${r.a} &ne; ${r.b}</span>
                        <button onclick="removeRule(${idx})" class="text-rose-400 hover:text-white">&times;</button>
                    </span>
                `;
            });
        }

        function generateGroups() {
            const size = parseInt(document.getElementById("groupSizeSelect").value);
            const enableJobs = document.getElementById("enableJobsToggle").checked;

            let shuffled = [...DEFAULT_ROSTER].sort(() => Math.random() - 0.5);

            // Monte Carlo shuffle iterations respecting separation rules
            for (let iter = 0; iter < 50; iter++) {
                let valid = true;
                let tempGroups = [];
                for (let i = 0; i < shuffled.length; i += size) {
                    tempGroups.push(shuffled.slice(i, i + size));
                }

                for (let rule of doNotPairRules) {
                    for (let grp of tempGroups) {
                        if (grp.includes(rule.a) && grp.includes(rule.b)) {
                            valid = false;
                            break;
                        }
                    }
                }

                if (valid) break;
                shuffled.sort(() => Math.random() - 0.5);
            }

            // Render Groups
            const grid = document.getElementById("groupsGrid");
            grid.innerHTML = "";

            const colors = ["#701c2e", "#2563eb", "#9333ea", "#059669", "#d97706", "#0891b2"];

            for (let i = 0; i < shuffled.length; i += size) {
                const groupMembers = shuffled.slice(i, i + size);
                const groupNum = Math.floor(i / size) + 1;
                const bannerColor = colors[(groupNum - 1) % colors.length];

                const card = document.createElement("div");
                card.className = "glass-card rounded-2xl overflow-hidden shadow-xl border border-slate-700/80 flex flex-col justify-between";

                let membersHtml = "";
                groupMembers.forEach((m, mIdx) => {
                    const roleBadge = enableJobs ? `<span class="text-[10px] text-purple-300 bg-purple-500/20 px-2 py-0.5 rounded-md font-semibold">${JOB_ROLES[mIdx % JOB_ROLES.length]}</span>` : '';
                    membersHtml += `
                        <div class="flex items-center justify-between p-2.5 bg-slate-900/60 rounded-xl border border-slate-800 text-xs">
                            <span class="font-bold text-white">${m}</span>
                            ${roleBadge}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div>
                        <div class="p-3 text-white font-bold flex items-center justify-between" style="background-color: ${bannerColor}">
                            <span>Team ${groupNum}</span>
                            <input type="color" value="${bannerColor}" onchange="this.parentElement.style.backgroundColor = this.value" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">
                        </div>
                        <div class="p-4 space-y-2">
                            ${membersHtml}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            }
        }

        window.onload = initGroupMaker;
    </script>
</body>
</html>
