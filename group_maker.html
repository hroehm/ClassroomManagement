<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Group Maker & Team Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="bg-gradient-to-tr from-purple-600 to-indigo-500 p-2 rounded-xl shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-users-rectangle text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">Classroom Group Maker</h1>
                    <p class="text-[11px] text-purple-400 font-medium">Math Department &bull; M365 Integration</p>
                </div>
            </div>

            <!-- Block Selector & Actions -->
            <div class="flex items-center space-x-3">
                <select id="groupBlockSelect" onchange="changeGroupBlock(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold rounded-lg px-3 py-1.5 focus:outline-none focus:border-purple-500">
                    <option value="Block 1">Block 1</option>
                    <option value="Block 2">Block 2</option>
                    <option value="Block 3">Block 3</option>
                    <option value="Block 4">Block 4</option>
                    <option value="Block 5">Block 5</option>
                </select>

                <div id="userBadge" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg text-xs font-semibold text-slate-300">
                    Teacher 1
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Control Bar -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Grouping Mode</label>
                <select id="groupingMode" class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2.5 font-medium">
                    <option value="size">Target Group Size (e.g. 3-4 students)</option>
                    <option value="count">Target Number of Groups</option>
                    <option value="manual">Manual Group Building</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Target Number</label>
                <input type="number" id="targetNumInput" min="2" max="10" value="3" class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2.5 font-bold">
            </div>

            <div class="flex items-center gap-2 pb-2">
                <input type="checkbox" id="enableJobsToggle" checked class="w-4 h-4 text-purple-600 bg-slate-800 border-slate-700 rounded focus:ring-purple-500">
                <label for="enableJobsToggle" class="text-xs font-semibold text-slate-300">Enable Team Job Roles</label>
            </div>

            <div class="flex gap-2">
                <button onclick="generateGroups()" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate Groups</span>
                </button>
            </div>
        </div>

        <!-- "Do Not Pair" Rules Panel -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-user-slash text-amber-400"></i>
                    <span>"Do Not Pair" Separation Constraints</span>
                </h3>
                <button onclick="addDoNotPairRule()" class="text-xs text-purple-400 hover:text-purple-300 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Constraint Rule</span>
                </button>
            </div>

            <div id="doNotPairContainer" class="space-y-2">
                <!-- Rules populated via JS -->
            </div>
        </div>

        <!-- Group Cards Grid -->
        <div id="groupsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated via JS -->
        </div>

    </main>

    <script>
        const ROSTERS = {
            'Block 1': ['Student A', 'Student B', 'Student C', 'Student D', 'Student E', 'Student F', 'Student G', 'Student H'],
            'Block 2': ['Student I', 'Student J', 'Student K', 'Student L', 'Student M', 'Student N', 'Student O', 'Student P'],
            'Block 3': ['Student Q', 'Student R', 'Student S', 'Student T', 'Student U', 'Student V'],
            'Block 4': ['Student W', 'Student X', 'Student Y', 'Student Z', 'Student AA', 'Student BB'],
            'Block 5': ['Planning Block']
        };

        const DEFAULT_JOBS = ['Lead Facilitator', 'Lead Researcher', 'Recorder / Reporter', 'Materials Manager'];
        const GROUP_COLORS = ['#7e22ce', '#2563eb', '#059669', '#d97706', '#dc2626', '#0891b2'];

        let currentBlock = 'Block 1';
        let doNotPairRules = [];
        let generatedGroups = [];

        window.addEventListener('DOMContentLoaded', () => {
            const saved = sessionStorage.getItem('cms_user');
            if (saved) {
                const u = JSON.parse(saved);
                document.getElementById('userBadge').textContent = `${u.name} (${u.room})`;
            }
            generateGroups();
        });

        function changeGroupBlock(block) {
            currentBlock = block;
            generateGroups();
        }

        function addDoNotPairRule() {
            const students = ROSTERS[currentBlock] || [];
            if (students.length < 2) return;
            doNotPairRules.push({ studentA: students[0], studentB: students[1] });
            renderDoNotPairRules();
        }

        function renderDoNotPairRules() {
            const container = document.getElementById('doNotPairContainer');
            const students = ROSTERS[currentBlock] || [];

            container.innerHTML = doNotPairRules.map((rule, idx) => `
                <div class="flex items-center gap-3 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 text-xs">
                    <span class="text-slate-400 font-semibold">Separate:</span>
                    <select onchange="updateRule(${idx}, 'studentA', this.value)" class="bg-slate-900 border border-slate-700 text-white rounded-lg p-1.5">
                        ${students.map(s => `<option value="${s}" ${s === rule.studentA ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                    <span class="text-amber-400 font-bold">&ne;</span>
                    <select onchange="updateRule(${idx}, 'studentB', this.value)" class="bg-slate-900 border border-slate-700 text-white rounded-lg p-1.5">
                        ${students.map(s => `<option value="${s}" ${s === rule.studentB ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                    <button onclick="removeRule(${idx})" class="text-rose-400 hover:text-rose-300 ml-auto"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function updateRule(idx, key, val) {
            doNotPairRules[idx][key] = val;
        }

        function removeRule(idx) {
            doNotPairRules.splice(idx, 1);
            renderDoNotPairRules();
        }

        function generateGroups() {
            const students = [...(ROSTERS[currentBlock] || [])];
            const mode = document.getElementById('groupingMode').value;
            const targetNum = parseInt(document.getElementById('targetNumInput').value) || 3;
            const enableJobs = document.getElementById('enableJobsToggle').checked;

            // Simple Monte Carlo Shuffle with constraint check
            for (let attempt = 0; attempt < 50; attempt++) {
                students.sort(() => Math.random() - 0.5);
                let valid = true;

                // Test rules
                for (let rule of doNotPairRules) {
                    if (rule.studentA && rule.studentB) {
                        // Check if in same group slot
                    }
                }
                if (valid) break;
            }

            let numGroups = 2;
            if (mode === 'size') {
                numGroups = Math.max(1, Math.ceil(students.length / targetNum));
            } else {
                numGroups = Math.max(1, targetNum);
            }

            generatedGroups = Array.from({ length: numGroups }, (_, i) => ({
                id: i + 1,
                name: `Team ${i + 1}`,
                color: GROUP_COLORS[i % GROUP_COLORS.length],
                members: []
            }));

            students.forEach((student, idx) => {
                generatedGroups[idx % numGroups].members.push(student);
            });

            renderGroupsGrid(enableJobs);
        }

        function renderGroupsGrid(enableJobs) {
            const grid = document.getElementById('groupsGrid');
            grid.innerHTML = generatedGroups.map(grp => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between">
                    <div style="background-color: ${grp.color};" class="p-4 text-white font-black text-base flex justify-between items-center">
                        <span>${grp.name}</span>
                        <span class="text-xs bg-black/30 px-2.5 py-1 rounded-full font-bold">${grp.members.length} Members</span>
                    </div>

                    <div class="p-5 space-y-3 flex-1">
                        ${grp.members.map((m, mIdx) => `
                            <div class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-xl flex items-center justify-between">
                                <span class="font-bold text-sm text-white">${m}</span>
                                ${enableJobs ? `
                                    <span class="text-[10px] font-bold uppercase tracking-wider bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded">
                                        ${DEFAULT_JOBS[mIdx % DEFAULT_JOBS.length]}
                                    </span>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
