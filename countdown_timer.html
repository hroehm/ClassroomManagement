<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disruption-Free Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans p-6">
    <div class="max-w-2xl w-full text-center space-y-8">
        <h1 class="text-2xl font-bold text-slate-400 tracking-widest uppercase">Classroom Activity Timer</h1>
        <div id="timerDisplay" class="text-8xl md:text-9xl font-black font-mono tracking-wider text-amber-400 bg-slate-900/80 border border-slate-800 py-12 rounded-3xl shadow-2xl">
            05:00
        </div>
        <div class="flex items-center justify-center gap-4 flex-wrap">
            <button onclick="setTimer(1)" class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold hover:border-amber-500">1 Min</button>
            <button onclick="setTimer(5)" class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold hover:border-amber-500">5 Min</button>
            <button onclick="setTimer(10)" class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold hover:border-amber-500">10 Min</button>
            <button onclick="setTimer(15)" class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold hover:border-amber-500">15 Min</button>
            <button onclick="setTimer(20)" class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold hover:border-amber-500">20 Min</button>
        </div>
        <div class="flex items-center justify-center gap-4">
            <button id="toggleBtn" onclick="toggleTimer()" class="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg transition">Start Timer</button>
            <button onclick="resetTimer()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm rounded-xl border border-slate-700 transition">Reset</button>
        </div>
    </div>
    <script>
        let totalSeconds = 300, remainingSeconds = 300, timerInterval = null;
        function updateDisplay() {
            const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const s = (remainingSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
        }
        function setTimer(mins) {
            clearInterval(timerInterval); timerInterval = null;
            document.getElementById('toggleBtn').innerText = 'Start Timer';
            totalSeconds = mins * 60; remainingSeconds = totalSeconds; updateDisplay();
        }
        function toggleTimer() {
            if (timerInterval) {
                clearInterval(timerInterval); timerInterval = null;
                document.getElementById('toggleBtn').innerText = 'Resume';
            } else {
                document.getElementById('toggleBtn').innerText = 'Pause';
                timerInterval = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--; updateDisplay();
                    } else {
                        clearInterval(timerInterval); timerInterval = null;
                        document.getElementById('toggleBtn').innerText = 'Completed!';
                        playChime();
                    }
                }, 1000);
            }
        }
        function resetTimer() {
            clearInterval(timerInterval); timerInterval = null;
            remainingSeconds = totalSeconds; updateDisplay();
            document.getElementById('toggleBtn').innerText = 'Start Timer';
        }
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 1.2);
            } catch(e){}
        }
        updateDisplay();
    </script>
</body>
</html>
