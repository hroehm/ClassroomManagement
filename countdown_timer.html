<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disruption-Free Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">

    <div class="absolute inset-0 bg-gradient-to-tr from-emerald-950/20 via-slate-950 to-indigo-950/20 pointer-events-none"></div>

    <div class="relative z-10 max-w-2xl w-full text-center space-y-8">
        
        <div>
            <span class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider mb-2">
                <i class="fa-solid fa-bell"></i> Disruption-Free Timer Tab
            </span>
            <h1 class="text-3xl font-extrabold text-white">Classroom Activity Timer</h1>
        </div>

        <!-- Big Clock Display -->
        <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-10 md:p-14 shadow-2xl relative">
            <div id="timerDisplay" class="text-7xl md:text-9xl font-black font-mono tracking-wider text-emerald-400">
                05:00
            </div>
            <div id="statusLabel" class="text-xs uppercase font-extrabold text-slate-500 tracking-widest mt-4">Ready to Start</div>
        </div>

        <!-- Preset Minutes -->
        <div class="flex justify-center gap-3">
            <button onclick="setPreset(1)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition">1 Min</button>
            <button onclick="setPreset(3)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition">3 Min</button>
            <button onclick="setPreset(5)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition">5 Min</button>
            <button onclick="setPreset(10)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition">10 Min</button>
            <button onclick="setPreset(15)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition">15 Min</button>
        </div>

        <!-- Timer Controls -->
        <div class="flex justify-center gap-4">
            <button onclick="toggleTimer()" id="btnStartPause" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-8 py-4 rounded-2xl text-base transition shadow-xl shadow-emerald-600/30 flex items-center gap-2">
                <i class="fa-solid fa-play"></i>
                <span>Start Timer</span>
            </button>
            <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-4 rounded-2xl text-base transition">
                Reset
            </button>
        </div>

    </div>

    <script>
        let totalSeconds = 300;
        let remainingSeconds = 300;
        let timerInterval = null;
        let isRunning = false;

        function updateDisplay() {
            const m = Math.floor(remainingSeconds / 60);
            const s = remainingSeconds % 60;
            document.getElementById('timerDisplay').textContent = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function setPreset(mins) {
            pauseTimer();
            totalSeconds = mins * 60;
            remainingSeconds = totalSeconds;
            updateDisplay();
            document.getElementById('statusLabel').textContent = `Set to ${mins} Minutes`;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            isRunning = true;
            document.getElementById('btnStartPause').innerHTML = '<i class="fa-solid fa-pause"></i><span>Pause</span>';
            document.getElementById('statusLabel').textContent = 'Timer Running...';

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    pauseTimer();
                    playChime();
                    document.getElementById('statusLabel').textContent = 'Time Up!';
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('btnStartPause').innerHTML = '<i class="fa-solid fa-play"></i><span>Start Timer</span>';
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            updateDisplay();
            document.getElementById('statusLabel').textContent = 'Ready to Start';
        }

        function playChime() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1.5);
        }
    </script>
</body>
</html>
