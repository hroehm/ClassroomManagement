<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Timer - Collierville High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://chnis.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .timer-bg { background: linear-gradient(135deg, #0f172a 0%, #172554 100%); }
        .digital-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.05em; }
    </style>
</head>
<body class="timer-bg min-h-screen text-slate-100 flex flex-col justify-between p-6">
    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-600 p-2.5 rounded-xl shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-hourglass-half text-xl text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white">Classroom Countdown Timer</h1>
                <p class="text-xs text-amber-400 font-medium">Standalone Disruption-Free Timer</p>
            </div>
        </div>

        <button onclick="toggleTheme()" class="p-2 text-slate-400 hover:text-white bg-slate-800 rounded-lg">
            <i class="fa-solid fa-circle-half-stroke text-lg"></i>
        </button>
    </header>

    <main class="my-auto text-center space-y-8">
        <div class="digital-font text-7xl sm:text-9xl font-extrabold text-amber-400 drop-shadow-2xl" id="timeDisplay">
            10:00
        </div>

        <!-- Presets Bar -->
        <div class="flex flex-wrap justify-center gap-2 max-w-xl mx-auto text-xs font-bold">
            <button onclick="setTimer(1)" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl border border-slate-700">1 Min</button>
            <button onclick="setTimer(5)" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl border border-slate-700">5 Min</button>
            <button onclick="setTimer(10)" class="bg-amber-600/40 border border-amber-500/50 text-amber-200 px-4 py-2.5 rounded-xl">10 Min</button>
            <button onclick="setTimer(15)" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl border border-slate-700">15 Min</button>
            <button onclick="setTimer(20)" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl border border-slate-700">20 Min</button>
            <button onclick="setTimer(30)" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl border border-slate-700">30 Min</button>
        </div>

        <!-- Timer Controls -->
        <div class="flex justify-center items-center space-x-4">
            <button onclick="startTimer()" id="btnStart" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-4 rounded-2xl text-base shadow-xl shadow-emerald-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-play"></i><span>Start</span>
            </button>
            <button onclick="pauseTimer()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-8 py-4 rounded-2xl text-base shadow-xl shadow-amber-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-pause"></i><span>Pause</span>
            </button>
            <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-8 py-4 rounded-2xl text-base border border-slate-700 flex items-center space-x-2">
                <i class="fa-solid fa-rotate-left"></i><span>Reset</span>
            </button>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
        Collierville High School Classroom Management System &bull; Standalone Tab View
    </footer>

    <script>
        let totalSeconds = 600;
        let timerInterval = null;
        let initialSeconds = 600;

        function updateDisplay() {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById("timeDisplay").textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function setTimer(minutes) {
            pauseTimer();
            totalSeconds = minutes * 60;
            initialSeconds = totalSeconds;
            updateDisplay();
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    pauseTimer();
                    playChimeSound();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = initialSeconds;
            updateDisplay();
        }

        function playChimeSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 chime
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 2.5);
            } catch(e) {
                console.log("Audio alert triggered");
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("invert");
        }

        updateDisplay();
    </script>
</body>
</html>
