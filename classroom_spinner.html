<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Job Wheel Spinner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="bg-gradient-to-tr from-amber-600 to-indigo-500 p-2 rounded-xl shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-dharmachakra text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white leading-tight">Job Wheel Spinner</h1>
                    <p class="text-[11px] text-amber-400 font-medium">Math Department &bull; M365 Integration</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <select id="spinnerBlockSelect" onchange="changeSpinnerBlock(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold rounded-lg px-3 py-1.5 focus:outline-none focus:border-amber-500">
                    <option value="Block 1">Block 1</option>
                    <option value="Block 2">Block 2</option>
                    <option value="Block 3">Block 3</option>
                    <option value="Block 4">Block 4</option>
                    <option value="Block 5">Block 5</option>
                </select>

                <div id="userBadge" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg text-xs font-semibold text-slate-300">
                    Teacher 1
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col items-center justify-center space-y-6">

        <div class="text-center space-y-1">
            <h2 class="text-2xl font-extrabold text-white">Dual Concentric Job Spinner</h2>
            <p class="text-xs text-slate-400">Outer Ring: Students &bull; Inner Ring: Classroom Jobs</p>
        </div>

        <!-- Wheel Canvas Container -->
        <div class="relative w-[360px] h-[360px] md:w-[440px] md:h-[440px] flex items-center justify-center">
            <!-- Pointer Arrow -->
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20 text-amber-400 text-3xl filter drop-shadow-md">
                <i class="fa-solid fa-location-pin"></i>
            </div>
            <canvas id="wheelCanvas" width="440" height="440" class="rounded-full shadow-2xl border-4 border-slate-800"></canvas>
        </div>

        <!-- Spin Controls -->
        <button onclick="spinWheel()" id="spinBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-black px-10 py-4 rounded-2xl text-base transition shadow-xl shadow-amber-600/30 flex items-center gap-2">
            <i class="fa-solid fa-rotate text-lg"></i>
            <span>Spin Job Wheel</span>
        </button>

        <!-- Result Modal -->
        <div id="resultModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
                <div class="w-14 h-14 bg-amber-600/20 text-amber-400 rounded-2xl border border-amber-500/30 flex items-center justify-center text-2xl mx-auto">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h3 class="text-xl font-extrabold text-white">Pairing Selected!</h3>
                <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700/60 space-y-2">
                    <div id="resStudent" class="text-lg font-bold text-amber-300">Student A</div>
                    <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">&bull; Assigned Job &bull;</div>
                    <div id="resJob" class="text-base font-extrabold text-white">Lead Facilitator</div>
                </div>
                <button onclick="closeResultModal()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl text-xs transition">
                    Awesome!
                </button>
            </div>
        </div>

    </main>

    <script>
        const ROSTERS = {
            'Block 1': ['Student A', 'Student B', 'Student C', 'Student D', 'Student E', 'Student F', 'Student G', 'Student H'],
            'Block 2': ['Student I', 'Student J', 'Student K', 'Student L', 'Student M', 'Student N', 'Student O', 'Student P'],
            'Block 3': ['Student Q', 'Student R', 'Student S', 'Student T', 'Student U', 'Student V'],
            'Block 4': ['Student W', 'Student X', 'Student Y', 'Student Z', 'Student AA', 'Student BB'],
            'Block 5': ['Planning Block']
        };

        const JOBS = ['Lead Facilitator', 'Lead Researcher', 'Recorder / Reporter', 'Materials Manager', 'Tech Specialist', 'Time Keeper'];
        const COLORS = ['#2563eb', '#7e22ce', '#059669', '#d97706', '#dc2626', '#0891b2', '#4f46e5', '#ca8a04'];

        let currentBlock = 'Block 1';
        let currentAngle = 0;
        let isSpinning = false;

        window.addEventListener('DOMContentLoaded', () => {
            const saved = sessionStorage.getItem('cms_user');
            if (saved) {
                const u = JSON.parse(saved);
                document.getElementById('userBadge').textContent = `${u.name} (${u.room})`;
            }
            drawWheel();
        });

        function changeSpinnerBlock(block) {
            currentBlock = block;
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const students = ROSTERS[currentBlock] || ['No Students'];
            const numSegments = students.length;
            const arc = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(220, 220);
            ctx.rotate(currentAngle);

            // Outer Wheel (Students)
            for (let i = 0; i < numSegments; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, 210, angle, angle + arc);
                ctx.lineTo(0, 0);
                ctx.fill();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Inter';
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillText(students[i], 190, 4);
                ctx.restore();
            }

            // Inner Wheel (Jobs)
            const innerArc = (2 * Math.PI) / JOBS.length;
            for (let j = 0; j < JOBS.length; j++) {
                const jAngle = j * innerArc;
                ctx.beginPath();
                ctx.fillStyle = COLORS[(j + 3) % COLORS.length];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, 110, jAngle, jAngle + innerArc);
                ctx.lineTo(0, 0);
                ctx.fill();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Inter';
                ctx.rotate(jAngle + innerArc / 2);
                ctx.textAlign = 'right';
                ctx.fillText(JOBS[j], 100, 3);
                ctx.restore();
            }

            // Center Hub
            ctx.beginPath();
            ctx.fillStyle = '#0f172a';
            ctx.arc(0, 0, 35, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const spinAngle = Math.PI * 10 + Math.random() * Math.PI * 4;
            const duration = 4000;
            const start = performance.now();

            function animate(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);

                currentAngle = spinAngle * easeOut;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    showResult();
                }
            }
            requestAnimationFrame(animate);
        }

        function showResult() {
            const students = ROSTERS[currentBlock] || ['Student A'];
            const randomStudent = students[Math.floor(Math.random() * students.length)];
            const randomJob = JOBS[Math.floor(Math.random() * JOBS.length)];

            document.getElementById('resStudent').textContent = randomStudent;
            document.getElementById('resJob').textContent = randomJob;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }
    </script>
</body>
</html>
