<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Job Spinner - Collierville High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://chnis.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-slate-100 font-sans antialiased pb-12">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="bg-emerald-600 p-2.5 rounded-xl shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-dharmachakra text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">Classroom Job Spinner</h1>
                    <p class="text-xs text-emerald-400 font-medium">Dual Concentric Wheel Pairing</p>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-200" id="userDisplayChip">
                Teacher 1 (Room 101)
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6 flex flex-col items-center">
        <!-- Canvas Wheel Area -->
        <div class="glass-card rounded-2xl p-6 shadow-2xl flex flex-col items-center space-y-6 w-full max-w-2xl">
            <div class="relative flex items-center justify-center">
                <!-- Pointer Marker -->
                <div class="absolute -top-3 text-rose-500 text-3xl z-20 drop-shadow">
                    <i class="fa-solid fa-caret-down"></i>
                </div>
                <canvas id="wheelCanvas" width="450" height="450" class="max-w-full rounded-full border-4 border-emerald-500/40 shadow-2xl bg-slate-900"></canvas>
            </div>

            <!-- Spin Controls -->
            <button onclick="spinWheel()" id="spinBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-base px-8 py-3.5 rounded-2xl shadow-lg shadow-emerald-600/30 flex items-center space-x-2">
                <i class="fa-solid fa-arrows-spin"></i>
                <span>SPIN WHEEL</span>
            </button>

            <!-- Result Box -->
            <div id="resultCard" class="hidden text-center p-4 bg-emerald-500/20 border border-emerald-500/40 rounded-2xl w-full">
                <div class="text-xs text-emerald-300 font-bold uppercase tracking-wider">Matched Result</div>
                <div id="resultText" class="text-lg font-bold text-white mt-1">Alex Miller &bull; Lead Facilitator</div>
            </div>
        </div>
    </main>

    <script>
        const students = ["Alex Miller", "Jordan Smith", "Taylor Johnson", "Morgan Davis", "Casey Brown", "Riley Wilson"];
        const jobs = ["Lead Facilitator", "Lead Researcher", "Recorder / Reporter", "Materials Manager", "Timekeeper", "Tech Specialist"];

        const colors = ["#059669", "#2563eb", "#9333ea", "#d97706", "#0891b2", "#e11d48"];

        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const canvas = document.getElementById("wheelCanvas");
            const ctx = canvas.getContext("2d");
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const outerR = 210;
            const innerR = 120;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Outer Wheel (Students)
            const numStudents = students.length;
            const arcOuter = (2 * Math.PI) / numStudents;

            for (let i = 0; i < numStudents; i++) {
                const angle = currentAngle + i * arcOuter;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, outerR, angle, angle + arcOuter);
                ctx.fill();

                // Draw Text
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arcOuter / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(students[i], outerR - 15, 4);
                ctx.restore();
            }

            // Inner Wheel (Jobs)
            const numJobs = jobs.length;
            const arcInner = (2 * Math.PI) / numJobs;

            for (let i = 0; i < numJobs; i++) {
                const angle = -currentAngle + i * arcInner;
                ctx.beginPath();
                ctx.fillStyle = colors[(i + 2) % colors.length];
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, innerR, angle, angle + arcInner);
                ctx.fill();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arcInner / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 10px sans-serif";
                ctx.fillText(jobs[i], innerR - 10, 4);
                ctx.restore();
            }

            // Center Ring
            ctx.beginPath();
            ctx.fillStyle = "#0f172a";
            ctx.arc(cx, cy, 35, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = "#10b981";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("resultCard").classList.add("hidden");

            const spinAngle = Math.PI * 8 + Math.random() * Math.PI * 4;
            const duration = 4000;
            const start = performance.now();

            function animate(time) {
                const elapsed = time - start;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = spinAngle * easeOut;
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    currentAngle = spinAngle % (2 * Math.PI);
                    drawWheel();
                    showResult();
                }
            }

            requestAnimationFrame(animate);
        }

        function showResult() {
            const studentIdx = Math.floor(Math.random() * students.length);
            const jobIdx = Math.floor(Math.random() * jobs.length);

            document.getElementById("resultText").textContent = `${students[studentIdx]} • ${jobs[jobIdx]}`;
            document.getElementById("resultCard").classList.remove("hidden");
        }

        window.onload = () => {
            const saved = sessionStorage.getItem("cms_active_user");
            if (saved) {
                const user = JSON.parse(saved);
                document.getElementById("userDisplayChip").textContent = `${user.name} (${user.room})`;
            }
            drawWheel();
        };
    </script>
</body>
</html>
